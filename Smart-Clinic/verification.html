<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Clinic - Verification</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6C63FF" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="phone-frame">
    <div class="auth-page">
      <div class="auth-circle-1"></div>
      <div class="auth-circle-2"></div>

      <div class="auth-icon-wrap small" style="margin-top: 30px;">
        <img src="assets/patient-icon.svg" alt="Smart Clinic" />
      </div>

      <h1 class="auth-heading" style="margin-top: 10px;">Verification</h1>
      <p class="auth-subtext" style="margin-top: 4px;">
        A verification code has been sent<br />to <span id="verifyContact">your phone</span>
      </p>

      <div class="otp-row">
        <input type="text" maxlength="1" class="otp-box" data-otp-index="0" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" data-otp-index="1" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" data-otp-index="2" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" data-otp-index="3" inputmode="numeric" />
      </div>

      <button id="verifyBtn" class="auth-primary-btn">Verify</button>

      <div class="keypad">
        <button type="button" class="keypad-key" data-key="1">1</button>
        <button type="button" class="keypad-key" data-key="2">2</button>
        <button type="button" class="keypad-key" data-key="3">3</button>
        <button type="button" class="keypad-key" data-key="4">4</button>
        <button type="button" class="keypad-key" data-key="5">5</button>
        <button type="button" class="keypad-key" data-key="6">6</button>
        <button type="button" class="keypad-key" data-key="7">7</button>
        <button type="button" class="keypad-key" data-key="8">8</button>
        <button type="button" class="keypad-key" data-key="9">9</button>
        <button type="button" class="keypad-key" data-key="#*"># *</button>
        <button type="button" class="keypad-key" data-key="0">0</button>
        <button type="button" class="keypad-key delete-key" data-key="delete" aria-label="Delete">
          <svg width="20" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E1E2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
            <line x1="12" y1="9" x2="18" y2="15"/>
            <line x1="18" y1="9" x2="12" y2="15"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
