<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Clinic - Forgot Password</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6C63FF" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="phone-frame">
    <div class="auth-page">
      <div class="auth-circle-1"></div>
      <div class="auth-circle-2"></div>

      <a href="login.html">
        <button class="auth-back-btn" aria-label="Go back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1E2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
      </a>

      <div class="auth-icon-wrap small" style="margin-top: 10px;">
        <img src="assets/patient-icon.svg" alt="Smart Clinic" />
      </div>

      <h1 class="auth-heading" style="margin-top: 14px;">Forgot Password?</h1>
      <p class="auth-subtext" style="margin-top: 8px;">
        Enter your email or phone number and we'll send you a link to reset your password.
      </p>

      <form id="forgotForm" class="forgot-card">
        <label for="forgotContact">Email or Phone</label>
        <input type="text" id="forgotContact" placeholder="Enter email or phone number" required />

        <div class="forgot-card-buttons">
          <a href="login.html" class="forgot-cancel-btn">Cancel</a>
          <button type="submit" class="forgot-reset-btn">Reset Password</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
