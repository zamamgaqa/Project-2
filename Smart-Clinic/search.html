<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Clinic - Search Doctors & Clinics</title>
    <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6C63FF" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="phone-frame">
    <div class="search-page">

      <div class="deco-circle-1"></div>
      <div class="deco-circle-2"></div>

            <div class="search-header">
        <a href="home.html">
          <button class="back-btn" aria-label="Go back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E1E2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6"/>
            </svg>
          </button>
        </a>
        <h1>search doctors<br />&amp; clinics</h1>
      </div>

            <div class="search-bar-row">
        <div class="search-bar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search doctors, clinics..." />
        </div>
        <button class="filter-btn" id="filterBtn" aria-label="Filter">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6C63FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>
          </svg>
        </button>
      </div>

            <div class="quick-buttons">
        <button class="quick-btn">Mental health</button>
        <button class="quick-btn">General Doctor</button>
        <button class="quick-btn">Dentist near me</button>
        <button class="quick-btn">Open pharmacy</button>
      </div>

            <div class="clinics-now-card">
        <h3>Find clinics open right now</h3>
        <div class="clinics-now-bottom">
          <div class="clinics-now-location">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            Based on your location
          </div>
          <button class="search-now-btn" id="searchNowBtn">Search now</button>
        </div>
      </div>

            <div class="section-block">
        <h4>Recent Searches</h4>
        <button class="recent-item" data-term="Dentist - Mowbray">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
          Dentist - Mowbray
        </button>
        <button class="recent-item" data-term="Districts 6 Clinic">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
          Districts 6 Clinic
        </button>
        <button class="recent-item" data-term="Blood Test Centers">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
          Blood Test Centers
        </button>
      </div>

            <div class="section-block">
        <h4>Browse by category</h4>
        <div class="category-grid">
          <button class="category-box" data-category="Dental">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3c-1.8 0-2.7.9-3.3 1.3C8.1 3.9 7.2 3 6 3 4.1 3 3 4.6 3 7c0 1.8.5 3 .9 4.6.5 1.8.9 5.5 2 6.9.5.7 1.3.7 1.7-.4.4-1.1.5-3.3 1.4-3.3s1 2.2 1.4 3.3c.4 1.1 1.2 1.1 1.7.4 1.1-1.4 1.5-5.1 2-6.9C14.5 10 15 8.8 15 7c0-2.4-1.1-4-3-4z" transform="translate(4.5 0)"/>
            </svg>
            <span>Dental</span>
          </button>
          <button class="category-box" data-category="Mental">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 4.5a3 3 0 0 0-3 3c0 .3 0 .6.1.8A2.8 2.8 0 0 0 4.5 11a2.8 2.8 0 0 0 1.3 2.4 3 3 0 0 0 2.7 4.1c.5 0 1-.1 1.4-.4v1.9a1.5 1.5 0 0 0 3 0V6a1.5 1.5 0 0 0-1.5-1.5H9z"/>
              <path d="M15 4.5a3 3 0 0 1 3 3c0 .3 0 .6-.1.8a2.8 2.8 0 0 1 .6 4.6 3 3 0 0 1-2.7 4.6V19"/>
              <path d="M11.5 8.5h-2M11.5 12H5.3M11.5 15.5H7"/>
            </svg>
            <span>Mental</span>
          </button>
          <button class="category-box" data-category="Optic">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span>Optic</span>
          </button>
          <button class="category-box" data-category="Cardio">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
            </svg>
            <span>cardio</span>
          </button>
        </div>
      </div>

            <div class="section-block">
        <h4>Nearby Clinics</h4>
        <div class="clinic-card">
          <img src="assets/district6-clinic.png" alt="District 6 Clinic" />
          <div class="clinic-card-info">
            <h5>District 6 Clinic <span class="clinic-distance">1.2 KM</span></h5>
            <span class="clinic-hours">Open 08:00 - 16:00</span>
          </div>
        </div>
      </div>

            <nav class="bottom-nav">
        <a href="home.html" style="text-decoration:none;">
          <button class="nav-item active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <path d="M9 22V12h6v10"/>
            </svg>
            Home
          </button>
        </a>
        <button class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
          Appointments
        </button>
        <button class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          Menu
        </button>
      </nav>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
