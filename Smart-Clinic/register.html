<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Clinic - Register</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6C63FF" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="phone-frame">
    <div class="auth-page">
      <div class="auth-circle-1"></div>
      <div class="auth-circle-2"></div>

      <div class="auth-icon-wrap small" style="margin-top: 36px;">
        <img src="assets/patient-icon.svg" alt="Smart Clinic" />
      </div>

      <h1 class="auth-heading" style="margin-top: 10px;">Welcome To Smart Clinic</h1>
      <p class="auth-subtext" style="margin-top: 4px;">Let's help you meet up your tasks</p>

      <form id="registerForm" class="auth-form">
        <input type="text" id="regFullName" class="auth-input" placeholder="Enter your full name" required />
        <input type="email" id="regEmail" class="auth-input" placeholder="Enter your email" required />
        <input type="password" id="regPassword" class="auth-input" placeholder="Enter password" required />
        <input type="password" id="regConfirmPassword" class="auth-input" placeholder="Confirm Password" required />

        <button type="submit" class="auth-primary-btn" style="margin: 6px 0 0 0;">Register</button>
      </form>

      <p class="auth-switch-row">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
