<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Appointment</title>
   
   <link rel="html" href="SPLASH.html" />
  <link rel="html" href="WELCOME.html" />
  <link rel="html" href="HOME.html" />
  <link rel="html" href="APPOINTMENT.html" />
  <link rel="html" href="BOOKAPPOINTMENT.html" />

</head>
<body>

  <div class="phone-card app-shell" style="position:relative;">
    <div class="header-art" style="height:90px;">
      <div class="blob blob-1" style="width:170px;height:170px;top:-90px;left:-60px;"></div>
    </div>

    <div class="app-content" style="padding-top:0; margin-top:-30px;">
      <div class="screen-header">
        <button class="back-btn" onclick='window.location.href='home.html"'>&#8592;</button>
        <span class="screen-title">My Appointment</span>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-target="upcomingPanel">Upcoming</button>
        <button class="tab-btn" data-target="pastPanel">Past</button>
      </div>

      <div id="upcomingPanel" class="tab-panel">
        <div class="doctor-card">
          <div class="doctor-photo">SJ</div>
          <div class="doctor-info">
            <div class="doctor-name">Dr Simon Josh</div>
            <div class="doctor-role">General Practioner</div>
            <span class="doctor-status upcoming">Upcoming</span>
            <div class="doctor-time">09:00AM to 09:45AM</div>
          </div>
        </div>
      </div>

      <div id="pastPanel" class="tab-panel" style="display:none;">
        <div class="search-bar light" style="margin-bottom:16px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1c1c1e" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input type="text" placeholder="Search your appointment" />
        </div>
        <div class="doctor-card">
          <div class="doctor-photo">XG</div>
          <div class="doctor-info">
            <div class="doctor-name">Dr. Xiang Glen</div>
            <div class="doctor-role">Ophthalmologist Specialist</div>
            <span class="doctor-status completed">Completed</span>
            <div class="doctor-time">14:15PM to 15:00PM</div>
          </div>
        </div>
        <div class="doctor-card">
          <div class="doctor-photo">SH</div>
          <div class="doctor-info">
            <div class="doctor-name">Dr. Sarah Howard</div>
            <div class="doctor-role">Dentist Specialist</div>
            <span class="doctor-status completed">Completed</span>
            <div class="doctor-time">12:00PM to 12:45PM</div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <a href="home.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        Home
      </a>
      <a href="appointments.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        Appointments
      </a>
      <button id="menuNavBtn" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        Menu
      </button>
    </div>

    <div class="sheet-overlay" id="menuSheetOverlay">
      <div class="menu-sheet">
        <div class="sheet-handle"></div>
        <div class="card-label">Menu</div>
        <a href="profile.html" class="menu-list-item">
          <span class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg></span>
          My Profile
        </a>
        <a href="book-appointment.html" class="menu-list-item">
          <span class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>
          Book Appointment
        </a>
        <a href="profile-menu.html" class="menu-list-item">
          <span class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
          Settings
        </a>
      </div>
    </div>
  </div>

  <script src="JAVASCRIPTT.js"></script>
</body>
</html>
